    content_details:
      - TTL/LRU automatic deletion worker issues and failure scenarios
      - "Problem: last_accessed_at not updated on upsert/sync operations"
      - "Problem: LRU deletion executes mechanically regardless of candidate count"
      - "Design shift: DB layer no longer judges deletion necessity, responsibility transferred to users/agents"
      - Trash mechanism requires explicit user operation with configurable grace period before physical deletion
      - delete_index tool deprecated; trash_index becomes sole deletion path
      - "Alternative options evaluated: safety valve approaches, targeted bug fixes, unconditional deletion"
      - "Impact analysis: structural safety gain, loss of automatic capacity management, additional disk space requirement"
      - "Affected components: TTL/LRU worker, KEY metadata MCP tool, disposal policy override functionality"
