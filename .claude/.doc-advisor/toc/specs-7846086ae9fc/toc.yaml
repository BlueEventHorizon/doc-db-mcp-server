  docs/specs/base/design/DES-001_doc_db_mcp_server_design.md:
    title: "DES-001: doc-db MCP Server Design"
    purpose: Defines the comprehensive design of the hybrid markdown search MCP server using Go, pure-Go SQLite, and two-layer search architecture combining embedding + BM25 + GREP signals with AI agent final judgment
    content_details:
      - "Two-layer architecture: Layer 1 (server) provides over-recall candidate pool from three signal parallel search; Layer 2 (AI agent) performs final relevance judgment"
      - "Three signal parallel search: embedding vectors with cosine similarity, BM25 lexical with NFKC normalization and ID pattern boost, full-text GREP substring matching with origin_signals tracking"
      - "Candidate merge and ranking: chunk_id deduplication, sorted by signal hit count, embedding score, chunk_id; ranking fine-tuning minimal to preserve recall"
      - "SQLite pure-Go schema: records, series_keys, chunks, embeddings tables with WAL mode and connection pool for concurrent read-write access"
      - "Hash-based dedup (DIF-02): identical key+path+hash skips re-embedding, appends series to existing record, cleans other records to maintain uniqueness"
      - Markdown chunking on heading boundaries with heading_path context tracking for search result explanation
      - OpenAI Embedding API (text-embedding-3-large default 3072-dim) with batch limit 100, exponential backoff, 60s timeout
      - LLM Rerank optional mode using gpt-4o-mini for ranking optimization with fallback to merge-order on failure
      - "Expiry worker: TTL-based (30 days default) and LRU-based (10,000 chunks limit) cleanup with per-key policy override via manage_index tool"
      - YAML configuration (~/.doc-db/doc-db.yaml) with fail-fast validation, API-key-only environment variables, no override for other settings
