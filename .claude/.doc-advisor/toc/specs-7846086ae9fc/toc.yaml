  docs/specs/expiry-visibility/design/ADR-003_ttl_lru_replaced_by_user_driven_trash.md:
    title: ADR-003 Discontinue Automatic TTL/LRU Deletion and Transition to User-Driven Trash Model
    purpose: Architecture decision documenting the transition from automatic TTL/LRU-based deletion to user-driven trash mechanism with recovery grace period to prevent accidental data loss
    content_details:
      - Automatic deletion bug causing unintended deletion of newly uploaded KEY without prior access
      - "Root cause: last_accessed_at not updated on upsert, making new records appear oldest accessed"
      - TTL/LRU worker behavior (EXP-02) ignores candidate count and deletes until capacity limit is resolved
      - "Decision: Database removes all automatic deletion logic; users/agents make deletion judgment calls"
      - "Trash mechanism: User-explicit trash operations only; configurable grace period (default 3 days) for recovery"
      - Physical deletion only occurs after grace period expires; users can restore data within grace period
      - "Rejected alternatives: Adding single-candidate safety check (insufficient), updating last_accessed_at only (logic itself is flawed)"
      - "Impact: Disk usage increases during grace period; operators must actively monitor key metadata"
    applicable_tasks:
      - TTL/LRU automatic deletion worker removal
      - Trash mechanism implementation
      - Key metadata monitoring design
      - User-driven deletion workflow implementation
      - Database deletion policy review
    keywords:
      - TTL
      - LRU
      - automatic deletion
      - trash model
      - grace period
      - recovery
      - metadata
