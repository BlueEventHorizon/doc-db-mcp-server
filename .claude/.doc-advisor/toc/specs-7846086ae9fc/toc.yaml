  docs/specs/base/design/DES-001_doc_db_mcp_server_design.md:
    title: DES-001 doc-db MCP Server Design
    purpose: Comprehensive design for hybrid search MCP server implementing vector embedding, BM25 lexical search, and grep-based search with optional LLM reranking, using pure-Go SQLite and Streamable HTTP transport
    content_details:
      - Two-layer search architecture with Layer 1 (server 3-signal parallel search) and Layer 2 (AI agent final judgment)
      - SQLite schema with tables for keys, records, series_keys, chunks, embeddings, pending_deletions, and WAL mode concurrency
      - KEY-unit exclusive control (WithKeyLock) using buffered channel for context-cancellable locking
      - series_keys management with DIF-02 (same hash embedding skip) and DIF-03 (new record creation path)
      - Deletion reservation with path-unit (immediate detach, deferred deletion) and series-wide (deferred both) variants
      - Content acquisition from three mutually-exclusive sources (payload, HTTP URL, local_path with path traversal security)
      - Partial embedding failure handling preserving successful chunks and deferring failed chunks for retry
      - Streaming sync_documents job design with desired-state matching and pending deletion sweep on startup
      - Module layering (cmd/docdb → internal/mcp → downstream) with unidirectional dependencies
      - Heading-path-based chunk division and substring-based BM25 scoring
      - Orphan record management preventing stale deletion reservations after cross-series data restoration
    applicable_tasks:
