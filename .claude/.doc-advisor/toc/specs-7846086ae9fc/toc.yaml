      - last_accessed_at
      - EXP-02
  docs/specs/expiry-visibility/design/DES-003_expiry_visibility_design.md:
    title: DES-003 Key Deletion Visibility and User-Driven Management Design
    purpose: Design specification for replacing automatic TTL/LRU deletion with user-driven key management, including trash mechanism with grace period recovery, enhanced key metadata visibility, and background worker for deferred physical deletion
    content_details:
      - Replaces TTL/LRU automatic deletion worker (internal/expiry) with user-driven operations and new internal/trash periodic worker
      - Keys table extended with trashed_at column (NULL-tolerant) to mark deleted keys in trash state; separate from orphan record management
      - "Enhanced key metadata: list_indexes expanded with ChunkCount; ListKeys returns KeyInfo including chunk count, doc count, series, last updated/accessed timestamps"
      - "New MCP tools: trash_index (mark key for deletion), list_trashed_indexes (show trashed keys with remaining grace period), restore_index (recover from trash)"
      - Query tool automatically excludes trashed keys from search results; delete_index operation preserved without modification
      - "Trash worker runs periodically: sweeps trashed_at-expired keys via DeleteKey and marked_at-expired orphan records via SweepPendingDeletions with cutoff filtering"
      - "Store API design: TrashKey/RestoreKey/ListTrashedKeys operations with KeyInfo and TrashedKeyInfo types; WithKeyLock ensures exclusive deletion"
      - "Alternatives considered: Single trashed_at column (adopted) vs. unified pending_deletions vs. separate trash table; single-column minimizes existing structure impact"
    applicable_tasks:
      - TTL/LRU automatic deletion worker removal and replacement with periodic trash worker
