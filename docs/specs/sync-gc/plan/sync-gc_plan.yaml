# === タスク一覧 ===
tasks:
  # ────────────────────────────────────────
  # フェーズ 1: WithKeyLock 基盤 + 直接排他性テスト（priority 90-99）
  # ────────────────────────────────────────
  - task_id: TASK-001
    title: internal/store — WithKeyLock 実装
    priority: 99
    status: completed
    design_id: DES-003
    depends_on: []
    group_id: null
    build_check: per_task
    description:
      - Store 構造体に keyLocksMu sync.Mutex と keyLocks map[string]*keyLockEntry を追加する
      - store.New（Store 初期化箇所）で keyLocks を make(map[string]*keyLockEntry) で初期化する（nil map への書き込みは panic するため必須）
      - keyLockEntry（ch chan struct{}（バッファ1）, ref int）を定義する（sync.Mutex ではなく channel を使うのは、ロック待機中でも ctx.Done() と select できるようにするため）
      - "WithKeyLock(ctx, key, fn func() error) error を実装する（参照カウント方式、ref が 0 になったエントリを map から削除。select 文で ch への送信と ctx.Done() を競合させ、ロック待機中のキャンセルに対応する）"
      - 既存の DeleteKey / UpsertRecord / DeleteSeries / DeleteSeriesAll 等は無改造のまま変更しない（WithKeyLock を内部で呼ばない設計を維持する）
    acceptance_criteria: "go build ./internal/store/... が成功し、既存の internal/store 全テストが変更なく通過すること"
    required_reading:
      - docs/specs/sync-gc/design/DES-003_desired_state_sync_and_deferred_gc_design.md

  - task_id: TASK-002
    title: internal/store — WithKeyLock 単体テスト
    priority: 97
    status: completed
    design_id: DES-003
    depends_on:
      - TASK-001
    group_id: null
    build_check: per_task
    description:
      - goroutine A が WithKeyLock(key, fn) を保持中（fn 内で time.Sleep 等の意図的遅延）に、goroutine B が同一 key で WithKeyLock を呼ぶとブロックされることをタイムアウト付きで直接検証するテストを書く
      - 異なる key に対する WithKeyLock 呼び出しは互いにブロックしないことを確認するテストを書く
      - ロック待機中に ctx を cancel すると fn を実行せず即座に ctx.Err() が返ることを確認するテストを書く（GC-05 の前提となる待機中キャンセル挙動）
      - 参照カウントが 0 になったエントリが keyLocks map から削除されることを確認するテストを書く
      - go test -race でレースが出ないことを確認する
    acceptance_criteria: "go test -race ./internal/store/... が新規 WithKeyLock テストを含め全通過すること"
    required_reading:
      - docs/specs/sync-gc/design/DES-003_desired_state_sync_and_deferred_gc_design.md

  # ────────────────────────────────────────
  # フェーズ 2: 既存ハンドラ・expiry への適用 + pending_deletions 永続層（priority 60-89）
  # ────────────────────────────────────────
  - task_id: TASK-003
    title: internal/mcp — 既存ハンドラ（upsert/delete/delete_series/delete_index）へ WithKeyLock 適用
    priority: 87
    status: completed
    design_id: DES-003
    depends_on:
      - TASK-001
    group_id: null
    build_check: per_task
    description:
      - upsert_documents ハンドラの処理呼び出し全体を store.WithKeyLock で 1 回だけ囲む（処理本体は無改造）
      - delete_documents ハンドラを同様に WithKeyLock で囲む
      - delete_series ハンドラを同様に WithKeyLock で囲む
      - delete_index ハンドラを同様に WithKeyLock で囲む
      - 各ハンドラで WithKeyLock をネストして呼ばないことを確認する（DES-003 §3.5.2 の禁止規約）
    acceptance_criteria: "go build ./internal/mcp/... が成功し、既存の internal/mcp 全テストが変更なく通過すること"
    required_reading:
      - docs/specs/sync-gc/design/DES-003_desired_state_sync_and_deferred_gc_design.md

  - task_id: TASK-004
    title: internal/expiry — WithKeyLock 適用
    priority: 85
    status: completed
    design_id: DES-003
    depends_on:
      - TASK-001
    group_id: null
    build_check: per_task
    description:
      - storeForExpiry インターフェースに WithKeyLock(ctx, key, fn func() error) error を追加する
      - runTTL の DeleteKey 呼び出しを w.st.WithKeyLock(ctx, key, func() error { return w.st.DeleteKey(ctx, key) }) に置き換える
      - runLRU の DeleteKey 呼び出しも同様に置き換える
      - TTL/LRU の判定ロジック本体（対象 KEY の選定）は変更しない
      - モックの storeForExpiry 実装に WithKeyLock を追加し、DeleteKey 呼び出しが WithKeyLock 経由であることを呼び出し順序で確認するテストを書く
    acceptance_criteria: "go test ./internal/expiry/... が既存テスト + 新規呼び出し順序テストを含め全通過すること"
    required_reading:
      - docs/specs/sync-gc/design/DES-003_desired_state_sync_and_deferred_gc_design.md

  - task_id: TASK-005
    title: internal/store — pending_deletions テーブル + 削除予約メソッド実装
    priority: 83
    status: completed
    design_id: DES-003
    depends_on:
      - TASK-001
    group_id: "GROUP-PENDING (1/2)"
    build_check: skip
    description:
      - pending_deletions テーブルを既存スキーマ初期化ブロックの直後に追加する（key/series/path/marked_at, PRIMARY KEY(key, series, path)）
      - "DetachSeriesFromPath(ctx, key, series, path) (orphaned bool, err error) を実装する（series_keys 行のみ削除・record/chunks/embeddings は削除しない。既存の「空 record 即時物理削除」不変条件の意図的な例外。単一トランザクション + s.mu 直列化。DES-003 §3.3）"
      - MarkSeriesForDeletion(ctx, key, series) (alreadyScheduled bool, err error) を実装する（path='' で upsert、既存有無を確認して返す）
      - MarkDocumentForDeletion(ctx, key, series, path) error を実装する（DetachSeriesFromPath で orphan になった record の物理削除予約）
      - ClearPendingDeletion(ctx, key, series, path) error を実装する（path="" で series 全体解除）
      - "DeleteOrphanRecords(ctx, key, path) (removed int, err error) を実装する（series_keys が 0 件の record のみ物理削除（chunks/embeddings/BM25 整合含む、既存 deleteRecordWithBM25Tx 再利用）。紐付き record には不触・冪等。doc_count 更新。WithKeyLock は内部で取得しない。DES-003 §3.3）"
      - "ListPendingDeletions(ctx, key, series) (paths []string, seriesWide bool, err error) を実装する（当該 key+series の path 単位予約一覧と series 全体予約の有無を 1 回で取得。読み取りのみ）"
      - "SweepPendingDeletions(ctx) (processed int, errs []error) を実装する（path='' なら DeleteSeriesAll（無改造）、それ以外（path 単位）は DeleteOrphanRecords を呼ぶ。DeleteSeries は使わない: stale 予約行が復活済み record から series を剥がして破壊するため（DES-003 §3.3）。WithKeyLock は取得しない。起動時専用である旨をコードコメントに明記する）"
    acceptance_criteria: "go vet ./internal/store/... が警告なく通ること（機能テストは同一グループの TASK-006 で実施）"
    required_reading:
      - docs/specs/sync-gc/design/DES-003_desired_state_sync_and_deferred_gc_design.md

  - task_id: TASK-006
    title: internal/store — pending_deletions 単体テスト
    priority: 82
    status: completed
    design_id: DES-003
    depends_on:
      - TASK-005
    group_id: "GROUP-PENDING (2/2)"
    build_check: on_group_complete
    description:
      - MarkSeriesForDeletion / MarkDocumentForDeletion の冪等性を確認する（2回目呼び出しで alreadyScheduled=true）
      - "DetachSeriesFromPath 単体テスト（SYN-03 の核心）: (a) 切り離し後、当該 series 指定の GetChunksForSearch に当該 path の chunk が現れないこと (b) record・chunks・embeddings が物理的に残存すること（orphan 保持） (c) 他 series 参照時は orphaned=false、単独参照時は orphaned=true を返すことを確認する"
      - SweepPendingDeletions が series 単位（DeleteSeriesAll）・path 単位（DeleteOrphanRecords）それぞれで正しく物理削除することを確認する
      - "stale 予約行の無害性検証（スイープの回帰テスト・最重要）: path 単位の削除予約が残ったまま当該 record が復活（series 再紐付け）した状態でスイープを実行しても、live record（chunks/embeddings 含む）が保持され予約行のみ除去されることを確認する（DeleteSeries ベースのスイープへの退行を直接検出する）"
      - "ListPendingDeletions 単体テスト: 予約なし・path のみ・series 全体のみ・両方の 4 状態で paths / seriesWide が正しく返ることを確認する"
      - "回帰テスト（最重要）: 同一 content_hash を複数 series が参照している状態で片方だけ切り離し・スイープした場合に record が残ることを確認する"
      - ClearPendingDeletion が該当行を削除すること・存在しない行への呼び出しが冪等であること・path="" で series 全体の削除予約を解除できることを確認する（sync 経由の統合挙動は TASK-013 で検証する）
      - "DeleteOrphanRecords 単体テスト（補償の核心）: series_keys 0 件の record のみ物理削除され（chunks/embeddings 含む）series 紐付き record には触れないこと・orphan 不在時は 0 件処理で冪等であること・削除後に doc_count が更新されることを確認する"
      - 個別失敗時にログ記録の上で処理継続することを確認する（silent failure 禁止方針）
    acceptance_criteria: "go test ./internal/store/... が pending_deletions 関連の全テストケースを通過すること"
    required_reading:
      - docs/specs/sync-gc/design/DES-003_desired_state_sync_and_deferred_gc_design.md

