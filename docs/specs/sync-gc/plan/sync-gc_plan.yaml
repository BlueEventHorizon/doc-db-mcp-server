      - "検索最新性の回帰テスト（SYN-03 の核心）: desired-state から path が欠落した sync_documents の完了直後に、当該 series 指定の検索を実行し、削除された path の chunk が返らないことを確認する（「削除予約はされたが検索に残り続ける」実装への退行を検出する）"
      - desired-state から path が欠落した場合、orphan になった record にのみ物理削除予約が作られ（他 series 参照 record には作られない）、再度含まれた場合に解除されることを確認する（SYN-03/04）
      - "自己修復の API 課金ゼロ検証（SYN-04）: 切り離し・削除予約済みの path を同一内容で再 sync すると、Embedder が呼ばれず（Embedder spy）、削除予約が解除され、当該 series 指定の検索に再び現れることを確認する"
      - "orphan 非リーク検証（レビュー指摘の再発防止）: 切り離し・削除予約済みの path を別内容で再 sync すると、旧 orphan record が CleanOtherSeries（DIF-03 経路の既存機構）で物理削除され、同一 key+path の record 数が 1 になることを確認する"
      - "失敗 path の予約保持検証: documents に含まれる path の upsertOne が失敗した場合、当該 path の削除予約が解除されず残ることを確認する（DES-003 §3.3 ClearPendingDeletion の実行条件）"
      - "CleanOtherSeries 失敗補償の検証: 削除予約中の path に store 層で直接 orphan record を人工的に用意した状態（CleanOtherSeries が掃除し損ねた状況の再現）で当該 path を含む sync を実行すると、DeleteOrphanRecords により orphan が回収されてから予約が解除され、同一 key+path に orphan が残らないことを確認する"
      - schedule_delete_series で series 全体を予約後、同一 key・series に sync_documents を呼ぶと予約が解除されることを確認する（自己修復）
      - schedule_delete_series が即座に削除せず already_scheduled を正しく返すことを確認する（GC-01）
      - "最重要回帰テスト: sync_documents 処理中に同一 KEY への upsert_documents / delete_index 呼び出しがブロックされることを確認する（SYN-08）"
      - "最重要回帰テスト: sync_documents 処理中に同一 KEY へ TTL/LRU 相当のロジック（runTTL/runLRU が呼ぶ WithKeyLock(ctx, key, func() error { return DeleteKey(ctx, key) }) 相当の呼び出し）を直接実行するとブロックされることを確認する（SYN-08、EXP-01/EXP-02 排他確認）"
      - root context を cancel した状態で sync_documents を実行するとジョブが failed になることを確認する（GC-05）
      - "再発防止テスト: sync_documents が job_id を返した直後に MCP リクエスト context を cancel しても（root context は生存させたまま）ジョブが done まで完走することを確認する（GC-05、request context 非依存の直接検証）"
    acceptance_criteria: "go test -race ./internal/mcp/... が新規3ツールの全テストケースを通過すること"
    required_reading:
      - docs/specs/sync-gc/design/DES-003_desired_state_sync_and_deferred_gc_design.md

