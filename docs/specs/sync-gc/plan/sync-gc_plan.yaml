  - task_id: TASK-010
    title: internal/mcp — sync_documents ハンドラ実装
    priority: 65
    status: completed
    design_id: DES-003
    depends_on:
      - TASK-005
      - TASK-009
    group_id: null
    build_check: per_task
    description:
      - "sync_documents MCP ツールを登録する（入力: key, series, documents）"
      - 一意な job_id を生成し即座に返す（SYN-05）。以降は root context 由来の独立 context で goroutine 実行する（GC-05）
      - goroutine 内で store.WithKeyLock(ctx, key, fn) を 1 回だけ呼び、fn 内で以下を直接実行する（WithKeyLock を再度呼ばない、DES-003 §3.5.2）
      - "fn 内: 既存 upsertOne で documents を処理する（DIF-01〜03 無改造、SYN-02）"
      - "fn 内: 既存 path 一覧を取得し documents に無い path を検出、DetachSeriesFromPath で series から即時切り離す（series 指定検索から直ちに消える）。orphaned=true が返った record のみ MarkDocumentForDeletion で物理削除予約する（SYN-03）"
      - "fn 内: 冒頭で ListPendingDeletions(ctx, key, series) により削除予約（path 一覧 + series 全体予約の有無）を 1 回で取得する"
      - "fn 内: documents に含まれ upsertOne が成功（processed/skipped）し、かつ削除予約が存在する path のみ、DeleteOrphanRecords（CleanOtherSeries 個別失敗の補償）→ ClearPendingDeletion の 2 段階で自己修復する。DeleteOrphanRecords がエラーの場合は Clear せずログ記録して予約を保持する（起動時スイープが orphan-only で安全に再試行する）。失敗 path の予約は保持する（DES-003 §3.3 の MANDATORY 実行条件）。series 全体の削除予約があれば解除する（SYN-04）"
      - SyncJobStatus（Handlers の sync.Mutex 保護 map）に進捗を書き込む
      - goroutine 内で root context 由来の ctx.Done() を、WithKeyLock 待機中および fn 実行中の双方で監視し、キャンセル検知時に SyncJobStatus.Status を "failed" に更新する（GC-05）
    acceptance_criteria: "go vet ./internal/mcp/... が警告なく通ること（機能テストは TASK-013 で実施）"
    required_reading:
