      - list_indexes を呼び KEY メタデータ一覧（chunk 数含む）を提示する対話フローを実装する
      - 削除選択時、series の有無に応じて確認要否を分岐する対話フローを実装する（series あり→確認必須、series なし→簡易操作）
      - list_trashed_indexes を呼びゴミ箱一覧（残り時間含む）を提示する対話フローを実装する
      - restore_index を呼ぶ復活操作の対話フローを実装する
      - PyYAML 等の外部 Python 依存を追加していないことを確認する
    acceptance_criteria: SKILL 実行で KEY メタデータ一覧・ゴミ箱一覧が提示され、削除・復活の各操作が対応する MCP ツールを正しく呼び出す
    required_reading:
