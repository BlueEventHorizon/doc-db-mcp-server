      - list_indexes の応答に chunk_count が正しく含まれること、ゴミ箱状態の KEY が含まれないことの単体テストを追加する
    acceptance_criteria: list_indexes の応答 JSON に各 KEY の chunk_count が正しい値で含まれ、ゴミ箱状態の KEY が含まれないことをテストで確認できる
