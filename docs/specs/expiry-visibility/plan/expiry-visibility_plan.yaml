  - task_id: TASK-012
    title: ゴミ箱 KEY への書き込み系 4 ツールの操作拒否
    priority: 78
    status: completed
    design_id: DES-003
    depends_on:
      - TASK-001
    group_id: null
    build_check: per_task
    description:
      - handleUpsert（upsert_documents）で処理開始前に IsTrashed(key) を確認し、true の場合は処理を実行せずエラーを返す
      - handleSyncDocuments（sync_documents）でも同様に IsTrashed(key) を確認し、true の場合は処理を実行せずエラーを返す
      - handleDeleteDocuments（delete_documents）でも同様に IsTrashed(key) を確認し、true の場合は処理を実行せずエラーを返す
      - handleScheduleDeleteSeries（schedule_delete_series）でも同様に IsTrashed(key) を確認し、true の場合は処理を実行せずエラーを返す
      - エラーメッセージに「対象 KEY はゴミ箱に入っている旨」と「restore_index で復活してから操作する旨」を含める
      - trashed_at はこの拒否処理によって変更されないことを確認する
      - ゴミ箱状態の KEY への 4 ツールいずれの呼び出しも拒否されること、trashed_at が変化しないことの単体テストを追加する
    acceptance_criteria: ゴミ箱状態の KEY への upsert_documents/sync_documents/delete_documents/schedule_delete_series がすべて拒否され、trashed_at が変化しないことをテストで確認できる
    required_reading:
