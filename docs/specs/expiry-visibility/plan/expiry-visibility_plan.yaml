      - 既存 DIF-02 不変条件テスト 3 件が green のままであることを最終確認する
      - README.md / docs/AI_INTEGRATION_GUIDE.md の MCP ツール一覧・SKILL 一覧の記述を更新する（delete_index 廃止・trash_index 等の新設を反映）
    acceptance_criteria: 統合テストが green で通過し、make verify が成功し、README/AI_INTEGRATION_GUIDE.md の記述が新しいツール構成と一致する
