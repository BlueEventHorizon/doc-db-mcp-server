tasks:
  - task_id: TASK-001
    title: keys.trashed_at カラム追加と TrashKey/RestoreKey/ListTrashedKeys 実装
    priority: 95
    status: completed
    design_id: DES-003
    depends_on: []
    group_id: null
    build_check: per_task
    description:
      - keys テーブルに trashed_at カラム（NULL 許容）を追加する
      - 起動時に PRAGMA table_info(keys) で trashed_at 列の有無を確認し、無ければ ALTER TABLE keys ADD COLUMN trashed_at TEXT を実行するマイグレーション処理を実装する
      - TrashKey(ctx, key) を実装する。対象 KEY が存在しない、または既にゴミ箱に入っている場合はエラーを返す
      - RestoreKey(ctx, key) を実装する。ゴミ箱に入っていない KEY を指定した場合はエラーを返す
      - ListTrashedKeys(ctx) を実装し、TrashedKeyInfo（Key, TrashedAt）を返す。残り時間の計算に必要な保持期間の設定値は Store 層が持たないため、TrashedKeyInfo に含めない（呼び出し元が算出する）
      - IsTrashed(ctx, key) を実装する
      - 正常系・多重投入エラー・存在しない KEY エラーの単体テストを追加する
      - trashed_at 列が存在しない DB に対してマイグレーションが実行されることの単体テストを追加する
    acceptance_criteria: TrashKey/RestoreKey/ListTrashedKeys/IsTrashed の正常系・異常系（多重投入・存在しない KEY）のテストと、マイグレーションのテストがすべて green で通過する
    required_reading:
      - docs/specs/expiry-visibility/design/DES-003_expiry_visibility_design.md
      - docs/specs/expiry-visibility/requirements/FNC-007_expiry_visibility_spec.md
      - internal/store/store.go

  - task_id: TASK-002
    title: KeyInfo に ChunkCount を追加
    priority: 90
    status: completed
    design_id: DES-003
    depends_on: []
    group_id: null
    build_check: per_task
    description:
      - KeyInfo 型に ChunkCount フィールドを追加する
      - ListKeys の実装に、ListKeysByLRU が使う chunk 数集計 SQL をマージする
      - ListKeys が返す各 KeyInfo の ChunkCount が正しい値であることの単体テストを追加する
    acceptance_criteria: ListKeys が返す KeyInfo.ChunkCount が、対象 KEY の実際の chunk 数と一致することをテストで確認できる
    required_reading:
      - docs/specs/expiry-visibility/design/DES-003_expiry_visibility_design.md
      - internal/store/store.go

  - task_id: TASK-003
    title: SweepPendingDeletions を ListPendingDeletionsOlderThan/SweepOnePendingDeletion に分割
    priority: 95
    status: completed
    design_id: DES-003
    depends_on: []
    group_id: null
    build_check: per_task
    description:
      - 既存の SweepPendingDeletions を廃止し、ListPendingDeletionsOlderThan(ctx, cutoff) と SweepOnePendingDeletion(ctx, entry) の 2 メソッドに分割する
      - ListPendingDeletionsOlderThan は marked_at が cutoff より前の予約一覧（PendingDeletionEntry）を返す読み取り専用メソッドとして実装する
      - SweepOnePendingDeletion は 1 件分の予約を物理削除し予約を解除する（ロックは呼び出し元の責務とする）
      - cmd/docdb/main.go の startupSweep を、一覧取得後にエントリ 1 件ごとに WithKeyLock で囲んで SweepOnePendingDeletion を呼ぶ形に変更する
      - 猶予期間内の予約が一覧に含まれないこと、猶予期間超過分のみが含まれることの境界値テストを追加する
      - 既存の DIF-02 不変条件テスト 3 件（store_test.go の TestAppendAndCleanSeries_DIF02 等）が green のままであることを確認する
    acceptance_criteria: cutoff 境界値テスト（猶予期間内は一覧に含まれない、超過分のみ含まれる）と既存 DIF-02 テスト 3 件がすべて green で通過する
    required_reading:
      - docs/specs/expiry-visibility/design/DES-003_expiry_visibility_design.md
      - docs/specs/expiry-visibility/requirements/FNC-007_expiry_visibility_spec.md
      - internal/store/pending.go
      - cmd/docdb/main.go

  - task_id: TASK-004
    title: internal/trash.Worker の新設
    priority: 85
    status: completed
    design_id: DES-003
    depends_on:
      - TASK-001
      - TASK-003
    group_id: null
    build_check: per_task
    description:
      - internal/trash パッケージを新設し、internal/expiry/expiry.go の Worker 定期実行パターン（Start, runOnce, Stats, KeyDeleteError）を土台に構造を実装する
      - runOnce 内で ListTrashedKeys の結果から保持期間超過の KEY を検出し、WithKeyLock で囲んで DeleteKey する
      - runOnce 内で ListPendingDeletionsOlderThan(ctx, cutoff) を呼び、返された予約 1 件ごとに WithKeyLock で囲んで SweepOnePendingDeletion を呼ぶ
      - 個別 KEY・record の削除失敗はログに記録し処理を継続する（silent failure 禁止）
      - 保持期間超過分のみ処理し未超過分に触れないことの単体テストを追加する
      - 個別エラー時に処理が継続することの単体テストを追加する
    acceptance_criteria: runOnce が保持期間超過分のみを処理し未超過分に触れないこと、個別エラー時も処理が継続することをテストで確認できる
    required_reading:
      - docs/specs/expiry-visibility/design/DES-003_expiry_visibility_design.md
      - internal/expiry/expiry.go
      - internal/store/pending.go

  - task_id: TASK-005
    title: internal/expiry の廃止と internal/trash.Worker への置換
    priority: 85
    status: completed
    design_id: DES-003
    depends_on:
