  - task_id: TASK-007
    title: trash_index / list_trashed_indexes / restore_index ハンドラの新設と delete_index の廃止
    priority: 80
    status: completed
    design_id: DES-003
    depends_on:
      - TASK-001
      - TASK-004
      - TASK-005
    group_id: null
    build_check: per_task
    description:
      - trash_index MCP ツールを新設する（TrashKey を呼ぶ）
      - list_trashed_indexes MCP ツールを新設する（ListTrashedKeys を呼ぶ）。ListTrashedKeys が返す trashed_at と設定値 trash.retention_days から remaining_seconds を算出し応答に含める
      - restore_index MCP ツールを新設する（RestoreKey を呼ぶ）
      - 各ツールの入出力スキーマとエラーハンドリング（存在しない KEY・多重投入・未投入の復活等）を実装する
      - delete_index ツール定義・ハンドラ（handleDeleteIndex）・DeleteIndexInput/Result 型を削除する（trash_index に置換）
      - delete_index に関連する既存テストを削除する
      - 4 ツールそれぞれの正常系・異常系の単体テストを追加する（trash_index/list_trashed_indexes/restore_index）。list_trashed_indexes は remaining_seconds の算出が正しいことも検証する
    acceptance_criteria: trash_index/list_trashed_indexes/restore_index の正常系・異常系テストがすべて green で通過し、grep -r "handleDeleteIndex\|DeleteIndexInput" の結果がゼロ件になる
