      - internal/expiry パッケージ（expiry.go, expiry_test.go, integration_test.go）を削除する
      - internal/config の ExpiryConfig を TrashConfig（RetentionDays, IntervalSeconds）に置き換える
      - doc-db.yaml.example の expiry セクションを trash セクション（retention_days, interval_seconds）に置き換える
      - go build ./... が成功することを確認する
      - internal/expiry への参照が残っていないことを grep で確認する
    acceptance_criteria: go build ./... が成功し、grep -r "internal/expiry" の結果がゼロ件になる
