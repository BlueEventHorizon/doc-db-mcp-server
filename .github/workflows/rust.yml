name: Rust checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: rustup update stable
      - run: cargo +stable fmt --check
      - run: cargo +stable clippy --all-targets --locked -- -D warnings
      - run: cargo +stable test --locked
      - run: make verify-version
      - run: cargo +stable install cargo-audit --version 0.23.0 --locked
      # 公式 SDK の間接依存 chrono の保守終了は警告として表示する。
      - run: cargo audit --deny unsound --deny yanked
